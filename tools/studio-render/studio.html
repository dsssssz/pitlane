  panel(12, 0.18, [-10, 0.9, -4], [0, 1, 0], 1.6, 0xdfe6e2); // v133: нейтральный стрип (без зелёного), было: тонкий неоновый стрип — только отблеск по кромке кузова

const pmrem = new THREE.PMREMGenerator(renderer);

// фон: графит со светлым «ореолом» за машиной, края уходят в цвет карточки (#101111)

  g.fillStyle = '#0e0f0f'; g.fillRect(0, 0, 1024, 640);

scene.background = bgTex();

// свет: ключ сверху-спереди с мягкой тенью, два контровых, лёгкий неоновый контур слева-сзади (дозированно)
const key = new THREE.DirectionalLight(0xffffff, 2.8); key.position.set(3, 9, 6); key.castShadow = true;

Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 }); scene.add(key);
const rimL = new THREE.DirectionalLight(0xe9f1ff, 3.0); rimL.position.set(-7, 4, -8); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xffffff, 2.2); rimR.position.set(8, 3.5, -6); scene.add(rimR);
scene.add(new THREE.HemisphereLight(0xbfc8cc, 0x0a0a0a, 0.5));

// пол: глянцевый графит (полупрозрачный — под ним зеркальная копия = мягкое отражение) + контактная тень
const floorAlpha = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); const r = g.createRadialGradient(256, 256, 0, 256, 256, 256); r.addColorStop(0, '#f7f7f7'); r.addColorStop(.25, '#f0f0f0'); r.addColorStop(.5, '#555'); r.addColorStop(.8, '#000'); g.fillStyle = r; g.fillRect(0, 0, 512, 512); return new THREE.CanvasTexture(c); })();

const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 96), floorMat); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.72 }));
shadowPlane.rotation.x = -Math.PI / 2; shadowPlane.position.y = 0.002; shadowPlane.receiveShadow = true; scene.add(shadowPlane);
// мягкая «AO» под днищем — радиальное затемнение
{ const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const r = g.createRadialGradient(128, 128, 10, 128, 128, 128); r.addColorStop(0, 'rgba(0,0,0,.92)'); r.addColorStop(.55, 'rgba(0,0,0,.55)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); const ao = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  ao.rotation.x = -Math.PI / 2; ao.position.y = 0.004; ao.name = 'ao'; scene.add(ao); }

const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 200);
const loader = new GLTFLoader();
let cur = null;

      if (isGlass) { glassish = true; mat.transparent = true; if (tr > 0.01 || op < 0.95) mat.depthWrite = false; }

window.renderCar = async (id, opt = {}) => {

  const root = gltf.scene; prep(root);

  root.scale.setScalar(4.8 / Math.max(size.x, size.y, size.z, 0.001)); root.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(root); box.getSize(size); const mid = box.getCenter(new THREE.Vector3());
  root.position.x -= mid.x; root.position.z -= mid.z; root.position.y -= box.min.y;
  const yaw = opt.yaw ?? Math.PI * 0.2; root.rotation.y = yaw;

  try { attachPitlanePlates(root, id, renderer); } catch (e) { console.warn('plates', e); }

  const mirror = pivot.clone(true); mirror.scale.y = -1; mirror.updateMatrixWorld(true); scene.add(mirror);

  const dist = (radius / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * (opt.zoom ?? 1.02) / Math.min(1, camera.aspect * 0.72);

  return renderer.domElement.toDataURL('image/png');
};
window.__ready = true;

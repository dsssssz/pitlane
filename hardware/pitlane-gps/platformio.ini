; PITLANE GPS — прошивка внешнего GNSS-приёмника (u-blox M9N / M10 + ESP32 BLE)
; Сборка:  pio run            (все платы)
;          pio run -e esp32c3 (только ESP32-C3 SuperMini)
; Прошивка: pio run -e esp32c3 -t upload

[platformio]
default_envs = esp32c3, esp32s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

; ESP32-C3 SuperMini (основной вариант)
[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DGPS_RX_PIN=20      ; ESP32 RX  <- TX GPS
  -DGPS_TX_PIN=21      ; ESP32 TX  -> RX GPS
  -DLED_PIN=8          ; синий LED на плате (активный низкий)
  -DLED_ACTIVE_LOW=1
  -DBTN_PIN=9          ; кнопка BOOT на плате
  -DBAT_ADC_PIN=3      ; середина делителя 100k/100k от BAT+
  -DBAT_DIVIDER=2.0f

; ESP32-S3 (DevKitC-1 / S3 SuperMini)
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DGPS_RX_PIN=18
  -DGPS_TX_PIN=17
  -DLED_PIN=-1         ; RGB на GPIO48 не используем; поставьте свой LED при желании
  -DLED_ACTIVE_LOW=0
  -DBTN_PIN=0          ; кнопка BOOT
  -DBAT_ADC_PIN=1
  -DBAT_DIVIDER=2.0f

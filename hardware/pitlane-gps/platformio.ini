; PITLANE GPS — прошивка внешнего GNSS-приёмника (u-blox M9N / M10 + ESP32: BLE + Wi-Fi/WSS)
; Сборка:  pio run            (все платы)
;          pio run -e esp32c3 (только ESP32-C3 SuperMini)
; Прошивка: pio run -e esp32c3 -t upload

[platformio]
default_envs = esp32c3, esp32s3, esp32c3kit

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  adafruit/Adafruit NeoPixel@^1.12.3
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.0
; BLE + Wi-Fi + TLS не влезают в 1.2 МБ стандартного раздела — один большой раздел приложения (без OTA)
board_build.partitions = huge_app.csv

; ESP32-C3 SuperMini (основной вариант)
[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DGPS_RX_PIN=20      ; ESP32 RX  <- TX GPS
  -DGPS_TX_PIN=21      ; ESP32 TX  -> RX GPS
  -DLED_PIN=8          ; синий LED на плате (активный низкий)
  -DLED_ACTIVE_LOW=1
  -DBTN_PIN=9          ; кнопка BOOT на плате
  -DBAT_ADC_PIN=3      ; середина делителя 100k/100k от VSYS (OUT+ после выключателя)
  -DBAT_DIVIDER=2.0f
  -DLEDS_PIN=4         ; DIN ленты WS2812B-2020 через 330 Ом
  -DLEDS_COUNT=26      ; 3 статусных + 23 кольцо (корпус-коробочка, вариант B); вариант A (SMA): 29
  -DLEDS_BRIGHT=32     ; макс. яркость кольца 0..255 (ток см. README)

; ESP32-C3 SuperMini — КОМПЛЕКТ v3 «USB от машины» (корпус C, docs/kit): без АКБ, без ленты,
; один адресный LED WS2812B 5050 под световодом, 25 Гц по умолчанию, настройка Wi-Fi — 3 включения USB подряд.
[env:esp32c3kit]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DGPS_RX_PIN=20      ; ESP32 RX  <- TX GPS   (жёлтый)
  -DGPS_TX_PIN=21      ; ESP32 TX  -> RX GPS   (синий)
  -DLED_PIN=8          ; синий LED на плате (внутри корпуса, для отладки)
  -DLED_ACTIVE_LOW=1
  -DBTN_PIN=9          ; BOOT (в корпусе недоступна; работает при открытой крышке)
  -DBAT_ADC_PIN=-1     ; АКБ нет — питание от USB
  -DLEDS_PIN=4         ; DIN статусного LED через 330 Ом (зелёный)
  -DLEDS_SINGLE=1
  -DLEDS_SINGLE_BRIGHT=48
  -DDEFAULT_RATE_HZ=25
  -DPL_TRIPLE_POWER_PORTAL=1
  -DPL_WIFI_TX_QDBM=34 ; 8,5 дБм — телефон рядом; лечит «не подключается» у части SuperMini, меньше помех GNSS

; ESP32-S3 (DevKitC-1 / S3 SuperMini)
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DGPS_RX_PIN=18
  -DGPS_TX_PIN=17
  -DLED_PIN=-1         ; RGB на GPIO48 не используем; поставьте свой LED при желании
  -DLED_ACTIVE_LOW=0
  -DBTN_PIN=0          ; кнопка BOOT
  -DBAT_ADC_PIN=1
  -DBAT_DIVIDER=2.0f
  -DLEDS_PIN=4
  -DLEDS_COUNT=26
  -DLEDS_BRIGHT=32

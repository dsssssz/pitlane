<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="100%" height="100%" fill="#101014"/>
<text x="30" y="44" fill="#fff" font-size="22" font-weight="bold">PITLANE GPS — схема: u-blox NEO-M9N/MAX-M10S + ESP32-C3 SuperMini + TP4056 + LiPo</text>
<rect x="40" y="110" width="300" height="300" rx="14" fill="#1b1b22" stroke="#39FF14" stroke-width="3"/>
<text x="190.0" y="140" fill="#39FF14" font-size="19" font-weight="bold" text-anchor="middle">GNSS: NEO-M9N</text>
<text x="190.0" y="162" fill="#aaa" font-size="13" text-anchor="middle">(или MAX-M10S), UART 3.3 В</text>
<circle cx="340" cy="170" r="6" fill="#39FF14"/>
<text x="326" y="175" fill="#eee" font-size="15" text-anchor="end">VCC</text>
<circle cx="340" cy="220" r="6" fill="#39FF14"/>
<text x="326" y="225" fill="#eee" font-size="15" text-anchor="end">GND</text>
<circle cx="340" cy="270" r="6" fill="#39FF14"/>
<text x="326" y="275" fill="#eee" font-size="15" text-anchor="end">TX</text>
<circle cx="340" cy="320" r="6" fill="#39FF14"/>
<text x="326" y="325" fill="#eee" font-size="15" text-anchor="end">RX</text>
<circle cx="340" cy="370" r="6" fill="#666"/>
<text x="326" y="375" fill="#eee" font-size="15" text-anchor="end">PPS</text>
<text x="60" y="395" fill="#777" font-size="12">PPS — не подключаем</text>
<rect x="80" y="440" width="220" height="70" rx="10" fill="#1b1b22" stroke="#6cf" stroke-width="2"/>
<text x="190" y="470" fill="#6cf" font-size="15" text-anchor="middle" font-weight="bold">Активная GNSS-антенна</text>
<text x="190" y="492" fill="#aaa" font-size="12" text-anchor="middle">SMA / IPEX(U.FL) → разъём на плате GPS</text>
<path d="M190,440 L190,410" fill="none" stroke="#6cf" stroke-width="4" stroke-linejoin="round"/>
<rect x="560" y="110" width="300" height="360" rx="14" fill="#1b1b22" stroke="#ffc940" stroke-width="3"/>
<text x="710.0" y="140" fill="#ffc940" font-size="19" font-weight="bold" text-anchor="middle">ESP32-C3 SuperMini</text>
<text x="710.0" y="162" fill="#aaa" font-size="13" text-anchor="middle">BLE 5, USB-C (прошивка)</text>
<circle cx="560" cy="170" r="6" fill="#ffc940"/>
<text x="574" y="175" fill="#eee" font-size="15" text-anchor="start">3V3</text>
<circle cx="560" cy="220" r="6" fill="#ffc940"/>
<text x="574" y="225" fill="#eee" font-size="15" text-anchor="start">GND</text>
<circle cx="560" cy="270" r="6" fill="#ffc940"/>
<text x="574" y="275" fill="#eee" font-size="15" text-anchor="start">GPIO20 (RX)</text>
<circle cx="560" cy="320" r="6" fill="#ffc940"/>
<text x="574" y="325" fill="#eee" font-size="15" text-anchor="start">GPIO21 (TX)</text>
<circle cx="560" cy="420" r="6" fill="#ffc940"/>
<text x="574" y="425" fill="#eee" font-size="15" text-anchor="start">GPIO3 (ADC)</text>
<circle cx="860" cy="170" r="6" fill="#ffc940"/>
<text x="846" y="175" fill="#eee" font-size="15" text-anchor="end">5V</text>
<circle cx="860" cy="220" r="6" fill="#ffc940"/>
<text x="846" y="225" fill="#eee" font-size="15" text-anchor="end">GND</text>
<text x="710" y="372" fill="#aaa" font-size="13" text-anchor="middle">встроено: LED = GPIO8, кнопка BOOT = GPIO9</text>
<text x="710" y="392" fill="#aaa" font-size="13" text-anchor="middle">(BOOT: коротко — 10 ↔ 25 Гц)</text>
<path d="M340,170 L560,170" fill="none" stroke="#ff5a5a" stroke-width="4" stroke-linejoin="round"/>
<text x="420" y="162" fill="#ff5a5a" font-size="13">3.3 В</text>
<path d="M340,220 L560,220" fill="none" stroke="#9aa" stroke-width="4" stroke-linejoin="round"/>
<text x="430" y="212" fill="#9aa" font-size="13">GND</text>
<path d="M340,270 L450,270 L450,270 L560,270" fill="none" stroke="#39FF14" stroke-width="4" stroke-linejoin="round"/>
<text x="385" y="262" fill="#39FF14" font-size="13">GPS TX → ESP RX</text>
<path d="M340,320 L560,320" fill="none" stroke="#4fc3ff" stroke-width="4" stroke-linejoin="round"/>
<text x="385" y="312" fill="#4fc3ff" font-size="13">GPS RX ← ESP TX</text>
<rect x="930" y="470" width="240" height="160" rx="14" fill="#1b1b22" stroke="#ff8a3d" stroke-width="3"/>
<text x="1050.0" y="500" fill="#ff8a3d" font-size="19" font-weight="bold" text-anchor="middle">TP4056 USB-C</text>
<text x="1050.0" y="522" fill="#aaa" font-size="13" text-anchor="middle">с защитой (DW01A)</text>
<circle cx="930" cy="540" r="6" fill="#ff8a3d"/>
<text x="944" y="545" fill="#eee" font-size="15" text-anchor="start">B+</text>
<circle cx="930" cy="590" r="6" fill="#ff8a3d"/>
<text x="944" y="595" fill="#eee" font-size="15" text-anchor="start">B−</text>
<circle cx="1170" cy="540" r="6" fill="#ff8a3d"/>
<text x="1156" y="545" fill="#eee" font-size="15" text-anchor="end">OUT+</text>
<circle cx="1170" cy="590" r="6" fill="#ff8a3d"/>
<text x="1156" y="595" fill="#eee" font-size="15" text-anchor="end">OUT−</text>
<rect x="560" y="600" width="260" height="110" rx="12" fill="#1b1b22" stroke="#e57" stroke-width="3"/>
<text x="680" y="640" fill="#e57" font-size="16" text-anchor="middle" font-weight="bold">LiPo 3.7 В 1000–2000 мАч</text>
<text x="680" y="664" fill="#aaa" font-size="13" text-anchor="middle">с платой защиты, разъём JST-PH 2.0</text>
<circle cx="820" cy="630" r="6" fill="#ff5a5a"/>
<text x="834" y="635" fill="#eee" font-size="15" text-anchor="start">+</text>
<circle cx="820" cy="685" r="6" fill="#9aa"/>
<text x="834" y="690" fill="#eee" font-size="15" text-anchor="start">−</text>
<path d="M820,630 L880,630 L880,540 L930,540" fill="none" stroke="#ff5a5a" stroke-width="4" stroke-linejoin="round"/>
<path d="M820,685 L900,685 L900,590 L930,590" fill="none" stroke="#9aa" stroke-width="4" stroke-linejoin="round"/>
<path d="M1170,540 L1190,540 L1190,100 L900,100 L900,170 L860,170" fill="none" stroke="#ff5a5a" stroke-width="4" stroke-linejoin="round"/>
<rect x="1010" y="86" width="90" height="28" rx="6" fill="#101014" stroke="#fff" stroke-width="2"/>
<text x="1055" y="105" fill="#fff" font-size="13" text-anchor="middle">выключатель</text>
<path d="M1170,590 L1180,590 L1180,730 L900,730 L900,720" fill="none" stroke="#9aa" stroke-width="4" stroke-linejoin="round"/>
<path d="M900,720 L915,720 L915,220 L860,220" fill="none" stroke="#9aa" stroke-width="4" stroke-linejoin="round"/>
<text x="1000" y="420" fill="#ff5a5a" font-size="13">OUT+ → выкл. → 5V ESP32</text>
<text x="1000" y="438" fill="#aaa" font-size="12">(LDO платы даёт 3.3 В)</text>
<rect x="380" y="560" width="140" height="120" rx="10" fill="#1b1b22" stroke="#bbb" stroke-dasharray="6 4" stroke-width="2"/>
<text x="450" y="585" fill="#ddd" font-size="14" text-anchor="middle">делитель</text>
<text x="450" y="605" fill="#ddd" font-size="13" text-anchor="middle">100 кОм + 100 кОм</text>
<text x="450" y="625" fill="#999" font-size="12" text-anchor="middle">(опционально —</text>
<text x="450" y="642" fill="#999" font-size="12" text-anchor="middle">заряд в приложении)</text>
<path d="M520,620 L540,620 L540,420 L560,420" fill="none" stroke="#c9f" stroke-width="4" stroke-linejoin="round"/>
<text x="430" y="700" fill="#c9f" font-size="13">середина → GPIO3</text>
<path d="M450,680 L450,745 L880,745 L880,630" fill="none" stroke="#ff5a5a" stroke-width="4" stroke-linejoin="round"/>
<text x="600" y="740" fill="#ff5a5a" font-size="12">верх делителя: BAT+ (OUT+), низ: GND</text>
</svg>
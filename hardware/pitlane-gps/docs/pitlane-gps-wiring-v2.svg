<rect x="540" y="560" width="310" height="330" rx="12" fill="#15151b" stroke="#444" stroke-width="2"/>
<text x="554" y="586" fill="#fff" font-size="14" text-anchor="start" font-weight="bold">Проверка питания и уровней</text>
<text x="554" y="605" fill="#ddd" font-size="12" text-anchor="start" font-weight="bold">Лента — от VSYS, не от 3V3:</text>
<text x="554" y="624" fill="#aaa" font-size="12" text-anchor="start">• WS2812B-2020: VDD 3.7–5.3 В; 3V3 мало</text>
<text x="554" y="643" fill="#aaa" font-size="12" text-anchor="start">  и перегрузит LDO платы</text>
<text x="554" y="662" fill="#aaa" font-size="12" text-anchor="start">• данные 3.3 В: VIH = 0.65·VDD = 2.73 В</text>
<text x="554" y="681" fill="#aaa" font-size="12" text-anchor="start">  при 4.2 В → сдвиг уровня не нужен</text>
<text x="554" y="700" fill="#aaa" font-size="12" text-anchor="start">• &lt; 3.7 В лента вне спецификации: режим</text>
<text x="554" y="719" fill="#aaa" font-size="12" text-anchor="start">  «низкий заряд» — красный (Vf ~2 В)</text>
<text x="554" y="738" fill="#aaa" font-size="12" text-anchor="start">  &lt; 3.5 В кольцо гасится прошивкой</text>
<text x="554" y="757" fill="#ddd" font-size="12" text-anchor="start" font-weight="bold">Ток (оценка по даташиту, 12 мА/канал):</text>
<text x="554" y="776" fill="#aaa" font-size="12" text-anchor="start">• неон #39FF14 на яркости 32/255:</text>
<text x="554" y="795" fill="#aaa" font-size="12" text-anchor="start">  ~2.6 мА/LED → ~60 мА на 23 LED</text>
<text x="554" y="814" fill="#aaa" font-size="12" text-anchor="start">• покой ленты ~0.6 мА × 26 ≈ 16 мА</text>
<text x="554" y="833" fill="#aaa" font-size="12" text-anchor="start">• выключатель SS12D00 — до 0.3–0.5 А ✓</text>
<text x="554" y="852" fill="#ddd" font-size="12" text-anchor="start" font-weight="bold">Делитель от VSYS: в выкл. АКБ не тратит</text>
<text x="554" y="871" fill="#aaa" font-size="12" text-anchor="start">ADC_11db: 2.1 В &lt; 2.5 В диапазона ✓</text>

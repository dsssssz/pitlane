# Canonical Worker config. Deploy from this directory:
#   cd worker && npx wrangler@3.114.17 deploy
name = "pitlane-api"
main = "src/main.js"
compatibility_date = "2024-09-01"
account_id = "dc344532c11330ddd28198123f1bf95f"
workers_dev = true

# v121: уведомления — сводки (склейка) и «дуэль заканчивается»; без событий ничего не шлёт
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "PITLANE"
id = "fc7e076d77824da184e7314c2fb3ff1b"

[vars]
# Production: SMS demo MUST stay "0" (demo OTP codes only for local dev).
SMS_DEMO = "0"
# Telegram bot username without @ (display only; login works from the TELEGRAM_BOT_TOKEN secret).
# Replace after creating the bot in @BotFather, e.g. "pitlane_login_bot".
TELEGRAM_BOT_USERNAME = "pitlane_official_bot"
# Telegram chat id that receives POST /feedback (see DEPLOY.md §23: /start the bot → getUpdates).
# Empty → feedback is only stored in KV (feedback:<ts>:<id>, TTL 180 d).
FEEDBACK_CHAT_ID = "8591275999"
# optional comma-separated extra origins (local dev only — never localhost in prod)
# EXTRA_ORIGINS = "http://127.0.0.1:5174"
# v128: погода заезда (Open-Meteo, src/wx.js). "1" — сервер запрашивает погоду при сохранении заезда.
# Бесплатный API Open-Meteo — только некоммерческий; при запуске платного Pro — OPEN_METEO_KEY (secret) или "0".
WX_ENABLED = "1"

# v116: live stream PITLANE GPS (Wi-Fi) → Mini App. One SQLite-backed Durable Object per pilot (works on the Free plan).
[[durable_objects.bindings]]
name = "GPS_LIVE"
class_name = "GpsLive"

# v134: Paddock — единая точка записи ленты (строгая согласованность вместо гонок read-modify-write в KV).
[[durable_objects.bindings]]
name = "PULSE_HUB"
class_name = "PulseHub"

[[migrations]]
tag = "v116-gpslive"
new_sqlite_classes = ["GpsLive"]

[[migrations]]
tag = "v134-pulsehub"
new_sqlite_classes = ["PulseHub"]

# Per-IP burst limits (Workers Rate Limiting API; in-memory per colo, no KV cost). period: 10 or 60 s.
[[unsafe.bindings]]
name = "RL_READ"
type = "ratelimit"
namespace_id = "8001"
simple = { limit = 240, period = 60 }

[[unsafe.bindings]]
name = "RL_WRITE"
type = "ratelimit"
namespace_id = "8002"
simple = { limit = 40, period = 60 }

# v89: ghost traces / profile banner images (bigger payloads) — extra per-IP read limit
[[unsafe.bindings]]
name = "RL_GHOST"
type = "ratelimit"
namespace_id = "8003"
simple = { limit = 60, period = 60 }

# Secrets (never in git):  npx wrangler@3.114.17 secret put <NAME>
#   TWILIO_SID / TWILIO_TOKEN / TWILIO_FROM  — SMS login
#   TELEGRAM_BOT_TOKEN                       — Telegram login (from @BotFather)
#   ADMIN_TOKEN                              — enables POST /admin/migrate-pilots (delete after use)
